<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=Edge" />
    <title>Clik - Calendar Link Generator</title>
    <script src="Scripts/jquery-3.6.0.js" type="text/javascript"></script>
    <script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js" type="text/javascript"></script>
    <script src="MessageRead.js" type="text/javascript"></script>
    <script src="Scripts/MessageBanner.js" type="text/javascript"></script>
    <link href="Content/Button.css" rel="stylesheet" type="text/css" />
    <link href="Content/MessageBanner.css" rel="stylesheet" type="text/css" />
    <link href="MessageRead.css" rel="stylesheet" type="text/css" />
    <link rel="stylesheet" href="https://res-1.cdn.office.net/files/fabric-cdn-prod_20230815.002/office-ui-fabric-core/11.1.0/css/fabric.min.css" />

    <style>
        body {
            margin: 0;
            padding: 0;
            background: #f8f9fa;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh;
        }

        .container {
            max-width: 100%;
            padding: 20px;
            box-sizing: border-box;
        }

        .app-logo {
            text-align: center;
            margin-bottom: 30px;
        }

        .logo-icon {
            background: #1a73e8;
            color: white;
            width: 60px;
            height: 60px;
            border-radius: 12px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            font-weight: 600;
            margin-bottom: 10px;
        }

        .main-title {
            font-size: 28px;
            font-weight: 600;
            color: #202124;
            text-align: center;
            margin: 30px 0;
            line-height: 1.2;
        }

        .link-container {
            background: white;
            border: 1px solid #e8eaed;
            border-radius: 8px;
            margin: 20px 0;
            position: relative;
        }

        .link-header {
            padding: 16px;
            border-bottom: 1px solid #e8eaed;
            display: flex;
            align-items: center;
            color: #1a73e8;
            font-weight: 500;
        }

        .link-header .icon {
            margin-right: 8px;
            font-size: 18px;
        }

        .link-display {
            padding: 20px;
            font-family: 'Courier New', monospace;
            font-size: 12px;
            line-height: 1.4;
            color: #5f6368;
            word-break: break-all;
            background: #fafafa;
            border-radius: 0 0 8px 8px;
            min-height: 80px;
            cursor: pointer;
            user-select: all;
        }

        .link-display:hover {
            background: #f1f3f4;
        }

        .button-group {
            margin: 20px 0;
        }

        .primary-btn {
            background: #1a73e8;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            width: 100%;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            text-decoration: none;
            box-sizing: border-box;
        }

        .primary-btn:hover {
            background: #1557b0;
            color: white;
        }

        .secondary-btn {
            background: white;
            color: #5f6368;
            border: 1px solid #dadce0;
            padding: 12px 24px;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            width: 100%;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            text-decoration: none;
            box-sizing: border-box;
        }

        .secondary-btn:hover {
            background: #f8f9fa;
            border-color: #c4c7c5;
        }

        .btn-icon {
            margin-right: 8px;
            font-size: 14px;
            width: 16px;
            height: 16px;
            display: inline-block;
        }

        /* Icon styles using CSS shapes instead of emojis */
        .icon-external::before {
            content: "↗";
            font-weight: bold;
        }

        .icon-copy::before {
            content: "📄";
            font-size: 14px;
        }

        .icon-refresh::before {
            content: "⟳";
            font-weight: bold;
            font-size: 16px;
        }

        .icon-calendar::before {
            content: "📅";
        }

        .icon-warning::before {
            content: "⚠";
            color: #ea4335;
        }

        .icon-retry::before {
            content: "⟳";
            font-weight: bold;
        }

        .loading {
            text-align: center;
            padding: 40px 20px;
            color: #5f6368;
        }

        .loading .spinner {
            border: 3px solid #f3f3f3;
            border-top: 3px solid #1a73e8;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .error-container {
            background: white;
            border: 1px solid #fce8e6;
            border-radius: 8px;
            padding: 20px;
            margin: 20px 0;
            text-align: center;
        }

        .error-icon {
            font-size: 24px;
            color: #ea4335;
            margin-bottom: 10px;
        }

        .error-title {
            font-size: 16px;
            font-weight: 500;
            color: #202124;
            margin-bottom: 8px;
        }

        .error-message {
            color: #5f6368;
            font-size: 14px;
            margin-bottom: 20px;
        }

        .status-message {
            padding: 12px;
            margin: 15px 0;
            border-radius: 6px;
            text-align: center;
            font-size: 14px;
            display: none;
        }

        .status-success {
            background: #e8f5e8;
            color: #137333;
            border: 1px solid #c4e7c4;
        }

        .status-error {
            background: #fce8e6;
            color: #d93025;
            border: 1px solid #f4b2a6;
        }

        .hidden {
            display: none;
        }

        .MessageBanner {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
        }
    </style>
</head>
<body class="ms-Fabric" dir="ltr">
    <div class="container">
        <!-- Loading State -->
        <div id="loading-section" class="loading">
            <div class="spinner"></div>
            <p>Analyzing email and generating calendar link...</p>
        </div>

        <!-- Main Content -->
        <div id="main-content" class="hidden">
            <!-- App Logo -->
            <div class="app-logo">
                <div class="logo-icon">Clik</div>
            </div>

            <!-- Main Title -->
            <h1 class="main-title">Calendar Link Generated</h1>

            <!-- Calendar Link Container -->
            <div class="link-container" id="calendar-section">
                <div class="link-header">
                    <span class="icon icon-calendar"></span>
                    Calendar Link
                </div>
                <div id="calendar-link" class="link-display" onclick="selectLinkText()">
                    Link will appear here...
                </div>
            </div>

            <!-- Action Buttons -->
            <div class="button-group">
                <a href="#" target="_blank" class="primary-btn" id="open-outlook-btn" style="display:none;">
                    <span class="btn-icon icon-external"></span>
                    Open in Outlook
                </a>
                <button onclick="copyCalendarLink()" class="secondary-btn">
                    <span class="btn-icon icon-copy"></span>
                    Copy Link
                </button>
                <button onclick="generateNewLink()" class="secondary-btn">
                    <span class="btn-icon icon-refresh"></span>
                    Generate New
                </button>
            </div>

            <div id="status-message" class="status-message"></div>
        </div>

        <!-- Error Section -->
        <div id="error-section" class="error-container hidden">
            <div class="error-icon icon-warning"></div>
            <div class="error-title">Error Generating Link</div>
            <div id="error-message" class="error-message">Unable to generate calendar link. Please try again.</div>
            <button onclick="generateNewLink()" class="primary-btn">
                <span class="btn-icon icon-retry"></span>
                Try Again
            </button>
        </div>
    </div>

    <div class="MessageBanner">
        <div class="MessageBanner-content">
            <div class="MessageBanner-text">
                <div class="MessageBanner-clipper">
                    <div class="ms-font-m-plus ms-fontWeight-semibold" id="notificationHeader"></div>
                    <div class="ms-font-m ms-fontWeight-semilight" id="notificationBody"></div>
                </div>
            </div>
            <button class="MessageBanner-expand" style="display:none"><i class="ms-Icon ms-Icon--chevronsDown"></i> </button>
            <div class="MessageBanner-action"></div>
        </div>
        <button class="MessageBanner-close"> <i class="ms-Icon ms-Icon--ChromeClose"></i> </button>
    </div>
</body>
</html>
